
services:
  redis:
    image: redis:${REDIS_VERSION}
    container_name: redis-server-${SERVICE_PORT}  #指定服务名

    volumes:
      - ./data-${SERVICE_PORT}:/data
      - ./conf/redis.conf:/conf/redis.conf:ro
      - ./custom-hosts:/etc/hosts:ro  # 只读挂载
    command: redis-server /conf/redis.conf --port ${SERVICE_PORT} --dir /data
    restart: always
    privileged: true

#    network_mode: host  # mac os 会失效
    ports:
      - "${SERVICE_PORT}:${SERVICE_PORT}"
